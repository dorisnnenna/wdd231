<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submission Confirmation | DNA Frozens & Condiments</title>
    <meta name="description"
        content="Confirmation page displaying details submitted through the DNA Frozens order form.">
    <meta name="author" content="Doris Nnenna Amuji">

    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/base.css">

    <script type="module">
        document.addEventListener('DOMContentLoaded', () => {
            // Parse URL Search Parameters from Form GET Request
            const params = new URLSearchParams(window.location.search);
            const resultsContainer = document.querySelector('#form-results');

            if (resultsContainer) {
                resultsContainer.innerHTML = `
          <p style="margin-bottom: 0.8rem;"><strong>Full Name:</strong> ${params.get('fullname') || 'Not provided'}</p>
          <p style="margin-bottom: 0.8rem;"><strong>Email Address:</strong> ${params.get('email') || 'Not provided'}</p>
          <p style="margin-bottom: 0.8rem;"><strong>Phone Number:</strong> ${params.get('phone') || 'Not provided'}</p>
          <p style="margin-bottom: 0.8rem;"><strong>Product of Interest:</strong> ${params.get('product') || 'Not provided'}</p>
          <p style="margin-bottom: 0.8rem;"><strong>Message / Order Details:</strong> ${params.get('comments') || 'Not provided'}</p>
        `;
            }

            // Footer Year & Last Modified
            const yearSpan = document.querySelector('#year');
            if (yearSpan) yearSpan.textContent = new Date().getFullYear();

            const modSpan = document.querySelector('#last-modified');
            if (modSpan) modSpan.textContent = document.lastModified;
        });
    </script>
</head>

<body>
    <header>
        <div class="logo-container">
            <img src="images/logo.webp" alt="DNA Frozens Logo" width="40" height="40">
            <h1>DNA Frozens & Condiments</h1>
        </div>
    </header>

    <main style="padding: 3rem 1rem; max-width: 600px; margin: 0 auto; text-align: center;">
        <h2 style="color: #173f35; margin-bottom: 1rem;">Thank You For Your Order Inquiry!</h2>
        <p style="margin-bottom: 2rem;">We have received your message and will get back to you shortly.</p>

        <div
            style="background: #ffffff; padding: 2rem; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: left; border-left: 4px solid #c49a4a; margin-bottom: 2rem;">
            <h3 style="margin-bottom: 1rem; color: #173f35;">Submitted Details:</h3>
            <div id="form-results">
                <!-- Dynamically populated via URL parameters -->
            </div>
        </div>

        <a href="index.html"
            style="background-color: #173f35; color: #f8f5ed; padding: 0.75rem 1.5rem; text-decoration: none; border-radius: 4px; font-weight: 500;">Return
            to Home</a>
    </main>

    <footer
        style="background-color: #173f35; color: #f8f5ed; text-align: center; padding: 1.5rem 1rem; margin-top: 2rem;">
        <p>&copy; <span id="year"></span> DNA Frozens & Condiments | Doris Nnenna Amuji</p>
        <p style="margin-top: 0.5rem;"><a href="https://www.youtube.com/watch?v=BUa4QylPRnk" target="_blank"
                rel="noopener" style="color: #f8f5ed;">Project Video Demonstration</a> | <a href="attributions.html"
                style="color: #f8f5ed;">Attributions</a></p>
        <p style="margin-top: 0.5rem;">Last Modified: <span id="last-modified"></span></p>
    </footer>
</body>

</html>
