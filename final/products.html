<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Catalog | DNA Frozens & Condiments</title>
    <meta name="description"
        content="Browse our selection of quality frozen poultry, seafood, meats, and handcrafted condiment pastes.">
    <meta name="author" content="Doris Nnenna Amuji">

    <meta property="og:title" content="DNA Frozens & Condiments - Quality Frozen Foods">
    <meta property="og:description"
        content="Discover premium frozen foods, fresh spices, and quality condiments delivered right to your doorstep. Browse our fresh catalog today!">
    <meta property="og:image" content="https://dorisnnenna.github.io/wdd231/final/images/logo.webp">
    <meta property="og:url" content="https://dorisnnenna.github.io/wdd231/final/products.html">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto+Serif:ital,opsz,wght@0,8..144,100..900;1,8..144,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/layout.css">
    <link rel="stylesheet" href="styles/components.css">

    <script type="module" src="scripts/main.js"></script>
</head>

<body>
    <header>
        <div class="logo-container">
            <img src="images/logo.webp" alt="DNA Frozens Logo" width="40" height="40">
            <span class="brand-title">DNA Frozens & Condiments</span>
        </div>
        <button id="menu-btn" aria-label="Toggle Navigation">&#9776;</button>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="contact.html">Order / Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="products-main">
        <h1 class="main-heading">Our Product Catalog</h1>

        <!-- Category Filter -->
        <div class="filter-wrapper">
            <label for="category-filter" class="filter-label">Filter Category:</label>
            <select id="category-filter" class="filter-select">
                <option value="all">All Products</option>
                <option value="frozen">Frozen Foods</option>
                <option value="condiment">Condiments & Spices</option>
            </select>
        </div>

        <!-- Container for dynamic product cards -->
        <div id="product-grid" class="product-grid">
            <!-- Dynamic content from products.json will be loaded here -->
        </div>

        <!-- Modal Dialog for Product Details -->
        <dialog id="product-modal" class="product-dialog">
            <div id="modal-details"></div>
            <button id="close-modal" class="modal-close-btn">Close</button>
        </dialog>
    </main>

    <footer>
        <p>&copy; <span id="year"></span> DNA Frozens & Condiments | Doris Nnenna Amuji</p>
        <p class="footer-modified">Last Modified: <span id="last-modified"></span></p>
        <p class="footer-links">
            <a href="attributions.html">Attributions</a> |
            <a href="https://www.youtube.com/watch?v=BUa4QylPRnk" target="_blank" rel="noopener">Video Demonstration</a>
        </p>
    </footer>
</body>

</html>
