<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Catalog | DNA Frozens & Condiments</title>
    <meta name="description"
        content="Browse our selection of quality frozen poultry, seafood, meats, and handcrafted condiment pastes.">
    <meta name="author" content="Doris Nnenna Amuji">

    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/layout.css">
    <link rel="stylesheet" href="styles/components.css">
    <script type="module" src="scripts/main.js" defer></script>


</head>

<body>
    <header>
    <div class="logo-container">
        <img src="images/logo.webp" alt="DNA Frozens Logo" width="40" height="40">
        <h1>DNA Frozens & Condiments</h1>
    </div>
        <button id="menu-btn" aria-label="Toggle Navigation">&#9776;</button>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="contact.html">Order / Contact</a></li>
            </ul>
        </nav>
    </header>

    <main style="padding: 2rem 1rem; max-width: 1200px; margin: 0 auto;">
        <h2 style="text-align: center; margin-bottom: 1.5rem;">Our Product Catalog</h2>

        <!-- Category Filter -->
        <div style="text-align: center; margin-bottom: 2rem;">
            <label for="category-filter" style="font-weight: 500; margin-right: 0.5rem;">Filter Category:</label>
            <select id="category-filter" style="padding: 0.5rem 1rem; border-radius: 4px; border: 1px solid #173f35;">
                <option value="all">All Products</option>
                <option value="frozen">Frozen Foods</option>
                <option value="condiment">Condiments & Spices</option>
            </select>
        </div>

        <!-- Container for dynamic product cards -->
        <div id="product-grid"
            style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1.5rem;">
            <!-- Dynamic content from products.json will be loaded here -->
        </div>

        <!-- Modal Dialog for Product Details -->
        <dialog id="product-modal"
            style="margin: auto; padding: 1.5rem; border: 2px solid #c49a4a; border-radius: 8px; max-width: 500px; width: 90%;">
            <div id="modal-details"></div>
            <button id="close-modal"
                style="margin-top: 1rem; background-color: #173f35; color: #f8f5ed; border: none; padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer;">Close</button>
        </dialog>
    </main>

    <footer
        style="background-color: #173f35; color: #f8f5ed; text-align: center; padding: 1.5rem 1rem; margin-top: 2rem;">
        <p>&copy; <span id="year"></span> DNA Frozens & Condiments | Doris Nnenna Amuji</p>
        <p style="margin-top: 0.5rem;">Last Modified: <span id="last-modified"></span></p>
        <p style="margin-top: 0.5rem;"><a href="attributions.html" style="color: #c49a4a;">Attributions</a> | <a
                href="https://www.youtube.com/watch?v=BUa4QylPRnk" target="_blank" style="color: #c49a4a;">Video Demonstration</a></p>
    </footer>
</body>

</html>
