<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order & Inquiry | DNA Frozens & Condiments</title>
    <meta name="description" content="Place an order or submit an inquiry directly to DNA Frozens & Condiments.">
    <meta name="author" content="Doris Nnenna Amuji">

    <meta property="og:title" content="DNA Frozens & Condiments - Quality Frozen Foods">
    <meta property="og:description"
        content="Discover premium frozen foods, fresh spices, and quality condiments delivered right to your doorstep. Browse our fresh catalog today!">
    <meta property="og:image" content="https://dorisnnenna.github.io/wdd231/images/logo.webp">
    <meta property="og:url" content="https://dorisnnenna.github.io/wdd231/contact.html">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto+Serif:ital,opsz,wght@0,8..144,100..900;1,8..144,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/layout.css">
    <link rel="stylesheet" href="styles/components.css">

    <script type="module" src="scripts/main.js"></script>
</head>

<body>
    <header>
        <div class="logo-container">
            <img src="images/logo.webp" alt="DNA Frozens Logo" width="40" height="40">
            <span class="brand-title">DNA Frozens & Condiments</span>
        </div>
        <button id="menu-btn" aria-label="Toggle Navigation">&#9776;</button>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="contact.html">Order / Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="contact-main">
        <h1 class="main-heading">Order & Inquiry Form</h1>
        <p class="contact-subtext">Fill out the form below to place a custom order or send us a message.</p>

        <form action="submit.html" method="get" class="contact-form-box">
            <div class="form-group">
                <label for="fullname">Full Name *</label>
                <input type="text" id="fullname" name="fullname" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address *</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone">
            </div>

            <div class="form-group">
                <label for="product">Product of Interest</label>
                <select id="product" name="product">
                    <option value="General Inquiry">General Inquiry</option>
                    <option value="Frozen Chicken Breasts">Frozen Chicken Breasts</option>
                    <option value="Smoked Fish Fillets">Smoked Fish Fillets</option>
                    <option value="Organic Tomato Paste">Organic Tomato Paste</option>
                    <option value="Artisanal Hot Pepper Sauce">Artisanal Hot Pepper Sauce</option>
                    <option value="Frozen Tiger Prawns">Frozen Tiger Prawns</option>
                </select>
            </div>

            <div class="form-group">
                <label for="comments">Order Details / Message *</label>
                <textarea id="comments" name="comments" rows="5" required></textarea>
            </div>

            <button type="submit" class="submit-btn">Submit Inquiry</button>
        </form>
    </main>

    <footer>
        <p>&copy; <span id="year"></span> DNA Frozens & Condiments | Doris Nnenna Amuji</p>
        <p class="footer-modified">Last Modified: <span id="last-modified"></span></p>
        <p class="footer-links">
            <a href="attributions.html">Attributions</a> |
            <a href="https://www.youtube.com/watch?v=BUa4QylPRnk" target="_blank" rel="noopener">Video Demonstration</a>
        </p>
    </footer>
</body>

</html>
